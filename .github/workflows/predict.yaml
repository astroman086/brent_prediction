name: Brent Crude Predictor

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  workflow_dispatch:        # Allows you to click 'Run workflow' manually anytime

jobs:
  run-predictor:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required so the bot can commit the updated CSV back to your repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance feedparser nltk scikit-learn

      - name: Run predictor script
        run: python brent_predictor.py

      - name: Commit and push updated CSV log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brent_predictions_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prediction logs [skip ci]" && git push)
