name: Brent Crude Evaluator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy pandas yfinance feedparser nltk scikit-learn
      - run: python brent_evaluator.py
