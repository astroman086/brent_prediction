name: Brent Crude Evaluator

on:
  schedule:
    - cron: '0 * * * *'   # Runs at minute 0 of every hour
  workflow_dispatch:

jobs:
  run-evaluator:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to update the CSV with actual prices/grades
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance feedparser nltk scikit-learn

      - name: Run evaluator script
        run: python brent_evaluator.py

      - name: Commit and push graded CSV log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brent_predictions_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-grade matured predictions [skip ci]" && git push)
